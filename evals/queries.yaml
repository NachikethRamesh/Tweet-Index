# Evaluation topics (Section 13.1).
#
# No `expected` lists here. Section 13.1 has them chosen by hand, which bakes
# in whatever the ranking already favoured when they were written -- the same
# circularity that made the Phase 1 acceptance criterion weak. Instead the
# three versions are pooled, the pool is judged blind, and every tweet marked
# relevant for a topic becomes its expected set. See evals/judge.py.
#
# Topics span both feeds, which cover different subjects (Section 7.5): the
# first thirteen lean on likes (AI, product, careers, strategy), the rest on
# bookmarks (fitness, interiors, culture) and on subjects that depend on links
# or images.

topics:
